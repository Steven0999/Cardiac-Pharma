  nitrate: {
    slides:{
      physiology:s("Vascular smooth muscle relaxes when nitric oxide (NO) raises cyclic GMP, lowering intracellular calcium. Nitrates are converted to NO in the body, causing vasodilation. They dilate veins (reducing preload) at low doses and arteries (reducing afterload) at higher doses — reducing cardiac workload and oxygen demand.",[bnf("n1","Glyceryl trinitrate"),rang("n2")]),
      pathophysiology:s("In angina, myocardial oxygen demand exceeds supply, causing chest pain. Nitrates relieve angina by dilating veins (less preload, less cardiac work) and dilating coronary arteries (more supply). In acute heart failure/pulmonary oedema, nitrates reduce preload, relieving congestion. GTN is the classic acute anginal relief.",[nice("n3","Stable angina","CG126")]),
      actions:s("Nitrates (GTN, isosorbide mononitrate/dinitrate) release nitric oxide → vasodilation. Venodilation reduces preload; coronary dilation improves supply. GTN (sublingual spray/tablet) acts within minutes for acute angina. Isosorbide mononitrate is longer-acting for prevention. Tolerance develops with continuous use — need a nitrate-free period.",[bnf("n4","Glyceryl trinitrate")]),
      prehospital:s("🚑 Used by paramedics: GTN spray (sublingual) for acute angina/chest pain and acute pulmonary oedema (JRCALC).\n\n⚠️ Hazards: profound hypotension — especially with phosphodiesterase-5 inhibitors (sildenafil/Viagra) → can be fatal. ALWAYS ask about PDE-5 inhibitor use before giving GTN. Headache and dizziness common. Do not give if BP low or in right ventricular MI.",[jrc("n5")]),
      interactions:s("❌ PDE-5 inhibitors (sildenafil, tadalafil) + nitrates can cause severe, potentially life-threatening hypotension — this combination is contraindicated.\n⚠️ Other antihypertensives + nitrates = additive hypotension.\n⚠️ Alcohol enhances hypotensive effect.\n⚠️ Continuous nitrate use → tolerance (need nitrate-free interval).",[bnf("n6","Nitrates interactions")]),
      indications:s("✅ Acute angina — GTN sublingual spray/tablet (NICE CG126)\n✅ Angina prophylaxis — isosorbide mononitrate\n✅ Acute heart failure / pulmonary oedema — IV GTN (reduce preload)\n✅ Acute coronary syndrome — IV GTN for ongoing chest pain\n✅ Anal fissure — topical GTN (off-cardiac use)",[nice("n7","Stable angina","CG126")]),
      contraindications:s("⛔ Concurrent PDE-5 inhibitors (sildenafil/tadalafil)\n⛔ Hypotension (systolic <90 mmHg)\n⛔ Severe aortic stenosis\n⛔ Hypertrophic obstructive cardiomyopathy\n⛔ Right ventricular MI (preload-dependent)\n⛔ Raised intracranial pressure\n\n⚠️ Caution: hypovolaemia, recent sildenafil use.",[bnf("n8","Glyceryl trinitrate — contraindications")]),
      dosages:s("💊 GTN spray (acute angina): 1–2 sprays sublingually; repeat after 5 min; call 999 if no relief after 2nd dose\n💊 GTN IV (pulmonary oedema/ACS): 10–200 mcg/min titrated to BP\n💊 Isosorbide mononitrate: 10–60 mg daily with a nitrate-free interval\n\n📋 ALWAYS ask about sildenafil/Viagra before giving. Sit patient down (hypotension).",[bnf("n9","Glyceryl trinitrate")]),
    },

      matching:[{drug:"GTN spray",condition:"Acute angina — sublingual, fast relief"},{drug:"Isosorbide mononitrate",condition:"Angina prophylaxis — long-acting"},{drug:"IV GTN",condition:"Acute pulmonary oedema and ACS chest pain"},{drug:"GTN",condition:"Must NOT be given with sildenafil"},{drug:"Topical GTN",condition:"Anal fissure (non-cardiac use)"}],
      drugForCondition:[{condition:"Acute angina chest pain — fast-acting sublingual drug",correct:"GTN spray",distractors:["Isosorbide mononitrate","Atorvastatin","Bisoprolol"]},{condition:"Long-acting nitrate for angina prevention",correct:"Isosorbide mononitrate",distractors:["GTN spray","Amlodipine","Ramipril"]},{condition:"IV nitrate to reduce preload in acute pulmonary oedema",correct:"GTN",distractors:["Isosorbide oral","Furosemide tablet","Aspirin"]}],
      conditionForDrug:[{drug:"GTN spray",conditions:["Acute angina","Recent sildenafil use","Systolic BP 80","Right ventricular MI"],correct:"Acute angina"},{drug:"Isosorbide mononitrate",conditions:["Angina prophylaxis","Concurrent PDE-5 inhibitor","Severe aortic stenosis","Hypotension"],correct:"Angina prophylaxis"}],
      mcq:[{q:"Nitrates relieve angina mainly by?",options:["Increasing heart rate","Venodilation reducing preload","Increasing contractility","Raising blood pressure"],correct:"Venodilation reducing preload"},{q:"Which drug is an ABSOLUTE contraindication with nitrates?",options:["Aspirin","Sildenafil (PDE-5 inhibitor)","Atorvastatin","Ramipril"],correct:"Sildenafil (PDE-5 inhibitor)"},{q:"What must paramedics ALWAYS ask before giving GTN?",options:["Allergies only","Recent sildenafil/Viagra use","Last meal","Smoking history"],correct:"Recent sildenafil/Viagra use"},{q:"Continuous nitrate use leads to?",options:["Dependence","Tolerance (need nitrate-free interval)","Toxicity","Bradycardia"],correct:"Tolerance (need nitrate-free interval)"},{q:"Most common side effect of nitrates?",options:["Constipation","Headache","Cough","Ankle swelling"],correct:"Headache"}],
      typing:[{scenario:"A patient with acute angina chest pain needs fast relief. Which sublingual drug?",answer:"GTN"},{scenario:"Before giving GTN, what drug class must you ask about because the combination can cause severe hypotension?",answer:"PDE-5 inhibitor"},{scenario:"Continuous nitrate use causes loss of effect — what is this called?",answer:"tolerance"}],

  flecainide: {
    slides:{
      physiology:s("The cardiac action potential begins with rapid sodium influx (phase 0) through fast sodium channels, driving electrical conduction. Class Ic antiarrhythmics block these sodium channels, markedly slowing conduction velocity. This stabilises abnormal electrical circuits — but can also be pro-arrhythmic in diseased hearts.",[bnf("f1","Flecainide acetate"),rang("f2")]),
      pathophysiology:s("In paroxysmal atrial fibrillation and supraventricular tachycardias, abnormal rapid circuits cause palpitations. Flecainide suppresses these in patients with structurally normal hearts. The 'pill-in-the-pocket' approach lets selected patients take it to terminate AF episodes. It is dangerous in ischaemic/structural heart disease (CAST trial).",[nice("f3","Atrial fibrillation","NG196")]),
      actions:s("Flecainide is a Class Ic antiarrhythmic — a potent sodium channel blocker that slows conduction and stabilises rhythm. Effective for AF and SVT in structurally normal hearts. The CAST trial showed increased mortality when used post-MI/structural heart disease — so it is restricted to patients without significant heart disease.",[bnf("f4","Flecainide acetate")]),
      prehospital:s("🚑 Common meds: flecainide (paroxysmal AF, SVT — 'pill in the pocket').\n\n⚠️ Hazards: pro-arrhythmic — can cause dangerous ventricular arrhythmias, especially in ischaemic or structural heart disease. Always given with an AV-nodal blocker (beta-blocker) in AF to prevent 1:1 atrial flutter conduction. Negative inotrope — avoid in heart failure.",[jrc("f5")]),
      interactions:s("❌ Structural/ischaemic heart disease = pro-arrhythmia (avoid).\n⚠️ Other antiarrhythmics (amiodarone) raise flecainide levels.\n⚠️ Beta-blockers/verapamil — additive negative inotropy and bradycardia.\n⚠️ Must co-prescribe AV-blocking agent in AF (prevents 1:1 flutter).",[bnf("f6","Flecainide interactions")]),
      indications:s("✅ Paroxysmal atrial fibrillation — rhythm control in structurally normal hearts (NICE NG196)\n✅ 'Pill-in-the-pocket' for selected paroxysmal AF patients\n✅ Supraventricular tachycardias (AVNRT, AVRT)\n✅ Atrial flutter (with AV-blocking agent)\n✅ Ventricular ectopics in normal hearts",[nice("f7","Atrial fibrillation","NG196")]),
      contraindications:s("⛔ Ischaemic heart disease / previous MI (CAST trial — increased mortality)\n⛔ Structural heart disease\n⛔ Heart failure (negative inotrope)\n⛔ 2nd/3rd degree AV block\n⛔ Atrial flutter without AV-blocking agent\n\n⚠️ Caution: must establish structurally normal heart (echo) before use.",[bnf("f8","Flecainide — contraindications")]),
      dosages:s("💊 Flecainide (oral, AF prophylaxis): 50–150 mg BD\n💊 Flecainide ('pill in the pocket'): 200–300 mg single dose (selected patients, with AV-blocking agent)\n💊 Always co-prescribe a beta-blocker or rate-limiting CCB in AF\n\n📋 Confirm structurally normal heart before prescribing. Contraindicated post-MI.",[bnf("f9","Flecainide acetate")]),
    },

      conditionForDrug:[{drug:"Flecainide",conditions:["Paroxysmal AF (normal heart)","Post-MI","Heart failure","2nd degree AV block"],correct:"Paroxysmal AF (normal heart)"},{drug:"Flecainide",conditions:["SVT in a structurally normal heart","Ischaemic heart disease","Structural heart disease","Cardiogenic shock"],correct:"SVT in a structurally normal heart"}],
      mcq:[{q:"Flecainide is which class of antiarrhythmic?",options:["Class Ia","Class Ic","Class III","Class IV"],correct:"Class Ic"},{q:"Flecainide blocks which channel?",options:["Potassium","Sodium","Calcium","Chloride"],correct:"Sodium"},{q:"Which trial showed flecainide increases mortality post-MI?",options:["CAST","HOPE","RALES","4S"],correct:"CAST"},{q:"In AF, flecainide must be combined with?",options:["A statin","An AV-blocking agent (beta-blocker)","An ACE inhibitor","Aspirin"],correct:"An AV-blocking agent (beta-blocker)"},{q:"Flecainide is contraindicated in?",options:["Young healthy patients","Structural/ischaemic heart disease","Paroxysmal AF","SVT"],correct:"Structural/ischaemic heart disease"}],
      typing:[{scenario:"A young patient with a structurally normal heart has paroxysmal AF and wants a 'pill in the pocket'. Which Class Ic antiarrhythmic?",answer:"flecainide"},{scenario:"Name the trial that showed flecainide increases mortality after a myocardial infarction.",answer:"CAST"},{scenario:"In AF, flecainide must be co-prescribed with which type of agent to prevent 1:1 flutter conduction?",answer:"beta-blocker"}],

  adenosine: {
    slides:{
      physiology:s("Adenosine is a natural nucleoside that activates A1 receptors in the AV node, briefly blocking conduction. This transiently interrupts re-entrant electrical circuits that pass through the AV node. Its effect is extremely short-lived — a half-life of under 10 seconds — because it is rapidly taken up by cells.",[bnf("ad1","Adenosine"),rang("ad2")]),
      pathophysiology:s("In paroxysmal supraventricular tachycardia (SVT), a re-entrant circuit through the AV node causes a sudden rapid regular tachycardia. Briefly blocking the AV node with adenosine breaks the circuit and restores normal rhythm. It is also used diagnostically to reveal underlying atrial activity in broad/narrow complex tachycardias.",[nice("ad3","Tachyarrhythmias","")]),
      actions:s("Adenosine activates A1 receptors in the AV node, transiently blocking conduction and terminating AV-node-dependent re-entrant SVT. Given as a rapid IV bolus followed by a saline flush (because of its ultra-short half-life). Causes a brief, alarming but transient sensation of chest tightness, flushing and 'impending doom' lasting seconds.",[bnf("ad4","Adenosine")]),

      pathophysiology:s("In heart failure with reduced EF, harmful RAAS and sympathetic activation outweigh the protective natriuretic peptide system. Sacubitril/valsartan (an ARNI — angiotensin receptor-neprilysin inhibitor) boosts natriuretic peptides AND blocks angiotensin II. The PARADIGM-HF trial showed it reduced mortality more than enalapril.",[nice("sac3","Sacubitril valsartan for treating symptomatic chronic heart failure","TA388")]),

function grad(tk){ const t=T[tk]||T.rose; return `linear-gradient(to bottom right, ${t.g1}, ${t.g2})`; }
function gradR(tk){ const t=T[tk]||T.rose; return `linear-gradient(to right, ${t.g1}, ${t.g2})`; }
function escHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatRef(r){ return `${r.author} (${r.year}) '${r.title}'. ${r.source}. Available at: ${r.url} [Accessed: ${r.accessed}].`; }

const MODULE_SOURCE = {
  olol:"NG106",pril:"NG106",sartan:"NG106",dipine:"NG136",verapamil:"NG196",
  statin:"NG238",ezetimibe:"NG238",xaban:"NG196",gatran:"NG196",parin:"NG185",
  warfarin:"NG196",grel:"NG185",amiodarone:"RCUK2025",ide:"NG106",spironolactone:"NG106",
  digoxin:"NG196",nitrate:"NG185",flecainide:"NG196",adenosine:"RCUK2025",sacubitril:"NG106",flozin:"NG106"
};
const GLOBAL_DRUGS=[...new Set(SYSTEM.suffixes.flatMap(sx=>sx.drugs))];
const FOCUS_PATTERN = {
  matching:["primary","emergency","ed","primary","emergency"],
  drugForCondition:["primary","emergency","ed"],
  conditionForDrug:["ed","primary"],
  mcq:["emergency","ed","primary","emergency","ed"],
  typing:["primary","emergency"],
};

function uniqueValues(values){ return [...new Set(values.filter(Boolean))]; }
function makeFourOptions(answer,candidates=[]){
  const fillers=shuffle(uniqueValues([...candidates,...GLOBAL_DRUGS]).filter(v=>v!==answer));
  return [answer,...fillers].slice(0,4);
}
function challengeBase(moduleId,kind,index,focus,prompt,answer,explanation,extra={}){
  const sx=SYSTEM.suffixes.find(s=>s.id===moduleId);
  return {id:`${moduleId}-${kind}-${index+1}`,moduleId,moduleName:sx.action,focus,type:"mcq",prompt,answer,explanation,sourceId:MODULE_SOURCE[moduleId]||"BNF",...extra};
}
function buildMedicationQuestions(moduleId){
  const md=ALL_MODULES[moduleId];
  const sx=SYSTEM.suffixes.find(s=>s.id===moduleId);
  if(!md||!sx) return [];
  const out=[];
  (md.quizData.matching||[]).slice(0,5).forEach((item,i)=>{
    const other=(md.quizData.matching||[]).map(x=>x.drug).filter(d=>d!==item.drug);
    out.push(challengeBase(moduleId,"match",i,FOCUS_PATTERN.matching[i],`Which medicine best matches this use or feature? ${item.condition}`,item.drug,`${item.drug} is the medicine paired with ${item.condition}.`,{options:makeFourOptions(item.drug,[...other,...sx.drugs])}));
  });
  (md.quizData.drugForCondition||[]).slice(0,3).forEach((item,i)=>{
    out.push(challengeBase(moduleId,"indication",i,FOCUS_PATTERN.drugForCondition[i],item.condition,item.correct,`${item.correct} is the best medicine match for this indication in the ${sx.action} module.`,{options:makeFourOptions(item.correct,item.distractors)}));
  });
  (md.quizData.conditionForDrug||[]).slice(0,2).forEach((item,i)=>{
    out.push(challengeBase(moduleId,"condition",i,FOCUS_PATTERN.conditionForDrug[i],`Which option is the appropriate indication or use for ${item.drug}?`,item.correct,`${item.correct} is the appropriate use; the other choices are contraindications, hazards or different indications.`,{options:makeFourOptions(item.correct,item.conditions)}));
  });
  (md.quizData.mcq||[]).slice(0,5).forEach((item,i)=>{
    out.push(challengeBase(moduleId,"mcq",i,FOCUS_PATTERN.mcq[i],item.q,item.correct,`Correct answer: ${item.correct}. Review the linked teaching slides and current guidance for the clinical context.`,{options:makeFourOptions(item.correct,item.options)}));
  });
  (md.quizData.typing||[]).slice(0,2).forEach((item,i)=>{
    out.push(challengeBase(moduleId,"typed",i,FOCUS_PATTERN.typing[i],item.scenario,item.answer,`Expected answer: ${item.answer}.`,{type:"typing",accepted:[item.answer]}));
  });
  (CARE_PATHWAY_QUESTIONS[moduleId]||[]).forEach((item,i)=>out.push({...item,id:`${moduleId}-pathway-${i+1}`,moduleId,moduleName:sx.action}));
  return out.slice(0,20);
}
function allChallengeQuestions(){
  return [...SYSTEM.suffixes.flatMap(sx=>buildMedicationQuestions(sx.id)),...ESSENTIAL_CARDIAC_QUESTIONS];
}
function questionText(item){ return [item.prompt,item.answer,...(item.options||[]),item.explanation||""].join(" ").toLowerCase(); }
function dedupeQuestions(items){
  const seen=new Set();
  return items.filter(item=>{ const key=`${item.prompt}|${item.answer}`.toLowerCase(); if(seen.has(key)) return false; seen.add(key); return true; });
}
function selectBalanced(items,limit=20,preservePriority=false){
  const pool=dedupeQuestions(items);
  const targets={primary:7,emergency:7,ed:6};
  const selected=[];
  Object.keys(targets).forEach(focus=>{
    const candidates=pool.filter(item=>item.focus===focus);
    (preservePriority?candidates:shuffle(candidates)).slice(0,targets[focus]).forEach(item=>selected.push(item));
  });
  if(selected.length<limit){
    const used=new Set(selected.map(x=>x.id));
    shuffle(pool.filter(x=>!used.has(x.id))).slice(0,limit-selected.length).forEach(item=>selected.push(item));
  }
  return shuffle(selected.slice(0,limit));
}
function buildConditionQuestions(topicId){
  const topic=CONDITION_TOPICS.find(t=>t.id===topicId);
  if(!topic) return [];
  const eligible=allChallengeQuestions().filter(q=>topic.moduleIds.includes(q.moduleId)||q.moduleId==="core");
  const matched=eligible.filter(q=>topic.terms.some(term=>questionText(q).includes(term)));
  const matchedKeys=new Set(matched.map(q=>q.id));
  const fallback=eligible.filter(q=>!matchedKeys.has(q.id));
  return selectBalanced([...shuffle(matched),...shuffle(fallback)],20,true);
}
function buildRandomQuestions(){
  const coreFocus=["primary","emergency","ed","ed"];
  const core=coreFocus.map(focus=>shuffle(ESSENTIAL_CARDIAC_QUESTIONS.filter(q=>q.focus===focus))[0]);
  const moduleFocus=[...Array(6).fill("primary"),...Array(6).fill("emergency"),...Array(4).fill("ed")];
  const modules=shuffle(SYSTEM.suffixes).slice(0,16);
  const moduleItems=modules.map((sx,i)=>{
    const candidates=buildMedicationQuestions(sx.id).filter(q=>q.focus===moduleFocus[i]);
    return shuffle(candidates)[0];
  });
  return selectBalanced([...core,...moduleItems,...shuffle(allChallengeQuestions())],20,true);
}
function prepareChallengeItems(items){
  return items.map(item=>({...item,options:item.type==="typing"?undefined:shuffle(item.options||[])}));
}
function sourceFor(item){ return CLINICAL_SOURCES[item.sourceId]||CLINICAL_SOURCES.BNF; }

    ? `<p>${escHtml(state.activeSuffix.affix)} — ${escHtml(state.activeSuffix.action)}</p>`
    : (state.view==='challenge'&&state.challenge?`<p>${escHtml(state.challenge.title)}</p>`:'');
  html += `<header><div class="hbar">
    <button class="burger" onclick="toggleMenu()">${state.menuOpen?IC.x:IC.menu}</button>
    <div class="htitle"><h1>Cardio<span>Pharm</span></h1>${sub}</div>
    <div class="${streakClass(state.streak)}"><span class="flame ${state.streak>=5?'pulse':''}">🔥</span>${state.streak}</div>
    <button class="settings-btn" onclick="openSettings()">${IC.settings}</button>
  </div></header>`;
  html += `<main class="wrap">`;
  if(state.view==='home') html+=renderHome();
  else if(state.view==='module') html+=renderModule();
  else if(state.view==='conditions') html+=renderConditions();
  else if(state.view==='challenge') html+=renderChallenge();
  else if(state.view==='progress') html+=renderProgress();
  html += `</main>`;
  // drawer
  if(state.menuOpen) html+=renderDrawer();
  if(state.settingsOpen) html+=renderSettings();
  root.innerHTML=html;
}

    const last=c.responses[c.responses.length-1];
    h+=`<div class="answer-feedback ${last.correct?'ok':'no'}" role="status"><p class="result">${last.correct?'✓ Correct':'✕ Not quite — '+escHtml(item.answer)}</p><p class="why">${escHtml(item.explanation)}</p><p class="src">Source: <a href="${source.url}" target="_blank" rel="noopener">${escHtml(source.label)}</a></p></div>`;
    h+=`<button class="btn-full" style="background:linear-gradient(90deg,#e11d48,#7c3aed)" onclick="nextChallengeQuestion()">${c.index+1<c.items.length?'Next question':'See results'} ${IC.chevR}</button>`;
  }
  h+=`</div>`;
  return h;
}

function renderChallengeDone(c){
  const pct=Math.round((c.correct/Math.max(c.answeredCount,1))*100);
  const missed=c.responses.filter(r=>!r.correct);
  let h=`<div class="challenge-complete fade"><div class="score-ring"><strong>${pct}%</strong><span>${c.correct}/${c.answeredCount}</span></div>`;
  h+=`<h2>${escHtml(c.title)} complete</h2><p>${pct>=80?'Strong result — review any missed safety points below.':pct>=60?'Good base — review the missed questions and repeat when ready.':'Use the review below, revisit the class slides, then repeat the challenge.'}</p>`;
  h+=`<div class="care-results">`;
  ["primary","emergency","ed"].forEach(key=>{ const f=CARE_FOCUS[key],b=c.breakdown[key]; h+=`<div class="care-result"><strong>${b.correct}/${b.total}</strong><span>${f.icon} ${escHtml(f.label)}</span></div>`; });
  h+=`</div>`;
  if(missed.length){
    h+=`<div class="review-box"><h3>Review missed questions (${missed.length})</h3>`;
    missed.forEach(r=>{ h+=`<div class="review-item"><p>${escHtml(r.item.prompt)}</p><strong>Correct: ${escHtml(r.item.answer)}</strong></div>`; });
    h+=`</div>`;
  }
  h+=`<div class="challenge-actions"><button class="btn-outline" onclick="repeatChallenge()">${IC.rotate} New set / repeat</button><button class="btn-rose" onclick="exitChallenge()">${IC.arrowLeft} Back</button></div>`;
  h+=`</div>`;
  return h;
}

// ═══════════════════════════════════════════════════════════════════════════
// MODULE (slides / quiz / done)
// ═══════════════════════════════════════════════════════════════════════════
function renderModule(){
  const sx=state.activeSuffix;
  const md=ALL_MODULES[sx.id];
  if(!md) return `<div class="coming-soon"><button class="back-btn" style="margin:0 auto 24px" onclick="goHome()">${IC.arrowLeft} Back</button><p>Module coming soon for ${escHtml(sx.affix)}.</p></div>`;
  if(state.phase==='slides') return renderSlides(sx,md);
  if(state.phase==='quiz') return renderQuiz(sx,md);
  if(state.phase==='done') return renderDone(sx);
}

function enabledSlideSections(md){
  return SLIDE_SECTIONS.filter(sec=>state.enabledSections[sec.key]!==false && md.slides[sec.key]);
}

function renderSlides(sx,md){
  const t=T[sx.tk]||T.rose;
  const secs=enabledSlideSections(md);
  if(!secs.length) return `<div class="coming-soon"><p>No slide sections enabled.</p><button class="btn-rose" style="margin:16px auto 0" onclick="goHome()">Back</button></div>`;
  if(state.slideIdx>=secs.length) state.slideIdx=secs.length-1;
  const cur=secs[state.slideIdx];
  const sd=md.slides[cur.key];
  const content=typeof sd==='string'?sd:(sd.content||'');
  const refs=typeof sd==='string'?[]:(sd.refs||[]);
  const pct=Math.round(((state.slideIdx+1)/secs.length)*100);
  let h=`<div class="fade">`;
  h+=`<div class="progress-row"><button class="back-btn" onclick="goHome()">${IC.arrowLeft} Back</button><span class="progress-num">${state.slideIdx+1}/${secs.length}</span></div>`;
  h+=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${gradR(sx.tk)}"></div></div>`;
  h+=`<div class="slide-header" style="background:${grad(sx.tk)}"><div class="slide-header-row"><span class="slide-header-icon">${cur.icon}</span><div><p class="label">${escHtml(sx.affix)} · ${escHtml(sx.action)}</p><h2>${escHtml(cur.label)}</h2></div></div></div>`;
  if(cur.key==='prehospital') h+=`<div><span class="ph-badge">🚑 Pre-hospital Focus</span></div>`;
  h+=`<div class="slide-body"><p class="slide-content">${escHtml(content)}</p>`;
  // bibliography
  if(refs.length){
    h+=`<div class="biblio"><button class="biblio-toggle ${state.biblioOpen?'open':''}" onclick="toggleBiblio()">${IC.file} Bibliography — ${escHtml(cur.label)} <span class="chev">${IC.chevD}</span></button>`;
    if(state.biblioOpen){
      h+=`<ol class="biblio-list">`;
      refs.forEach(r=>{ h+=`<li class="biblio-item"><span class="num">[${escHtml(r.id)}]</span>${escHtml(formatRef(r))} <a href="${escHtml(r.url)}" target="_blank" rel="noopener">[Link]</a></li>`; });
      h+=`</ol>`;
    }
    h+=`</div>`;
  }
  h+=`</div>`;
  if(cur.key==='dosages'){
    h+=`<div class="drug-pills">`;
    sx.drugs.forEach(d=>{ h+=`<span class="drug-pill" style="background:${t.light};color:${t.dark};border-color:${t.border}">${escHtml(d)}</span>`; });
    h+=`</div>`;
  }
  h+=`<div class="nav-row">`;
  h+=`<button class="nav-btn nav-prev" ${state.slideIdx===0?'disabled':''} onclick="prevSlide()">${IC.chevL} Prev</button>`;
  if(state.slideIdx<secs.length-1) h+=`<button class="nav-btn nav-next" style="background:${gradR(sx.tk)}" onclick="nextSlide()">Next ${IC.chevR}</button>`;
  else h+=`<button class="nav-btn nav-quiz" onclick="startQuiz()">Start Quizzes ${IC.chevR}</button>`;
  h+=`</div>`;
  h+=`<button class="challenge-launch" onclick="startMedicationChallenge('${sx.id}')">🎯 Start 20-question ${escHtml(sx.action)} clinical challenge</button>`;
  h+=`</div>`;
  return h;
}

// ═══════════════════════════════════════════════════════════════════════════
// QUIZ ENGINE
// ═══════════════════════════════════════════════════════════════════════════
function enabledQuizTypeList(){ return QUIZ_TYPES.filter(qt=>state.enabledQuizTypes[qt.key]!==false); }

function startQuiz(){
  const md=ALL_MODULES[state.activeSuffix.id];
  const types=enabledQuizTypeList().filter(qt=>md.quizData[qt.key]);
  state.quiz={ types, ti:0, phase:'intro', qi:0, answered:false, selAns:null, score:{correct:0,total:0}, qScore:{correct:0,total:0}, matchSel:null, matched:[], shuffledOpts:null, typeRes:null, typeInput:'', mDrugs:null, mConds:null };
  state.phase='quiz';
  render();
}

function shuffle(a){
  const copy=[...a];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function renderQuiz(sx,md){
  const q=state.quiz;
  const t=T[sx.tk]||T.rose;
  if(!q.types.length) return `<div class="coming-soon"><p>No quiz types enabled.</p><button class="btn-rose" style="margin:16px auto 0" onclick="finishModule()">Finish</button></div>`;
  const ct=q.types[q.ti];
  const qd=md.quizData[ct.key]||[];
  if(q.phase==='intro'){
    return `<div class="quiz-intro fade">
      <button class="back-btn" style="margin:0 auto 20px" onclick="backToSlides()">${IC.arrowLeft} Back to Slides</button>
      <div class="quiz-icon">${ct.icon}</div>
      <div class="quiz-pill" style="background:${t.light};color:${t.dark};border-color:${t.border}">Quiz ${q.ti+1} of ${q.types.length}</div>
      <h2>${escHtml(ct.label)}</h2>
      <p class="sub">${escHtml(sx.affix)} — ${escHtml(sx.action)}</p>
      <p class="count">${qd.length} question${qd.length!==1?'s':''}</p>
      <button class="btn-primary" style="background:${gradR(sx.tk)}" onclick="beginQuiz()">Begin</button>
    </div>`;
  }
  if(q.phase==='complete'){
    const pct=Math.round((q.qScore.correct/Math.max(q.qScore.total,1))*100);
    const emoji=pct>=80?'🏆':pct>=60?'⭐':'💊';
    const last=q.ti+1>=q.types.length;
    return `<div class="complete fade">
      <div class="emoji">${emoji}</div>
      <h2>${escHtml(ct.label)}</h2>
      <p class="score">${q.qScore.correct} / ${q.qScore.total}</p>
      <div class="complete-bar"><div class="complete-fill" style="width:${pct}%;background:${gradR(sx.tk)}"></div></div>
      <button class="btn-primary" style="background:${gradR(sx.tk)}" onclick="nextQuizType()">${last?'Finish Module':'Next: '+escHtml(q.types[q.ti+1].label)}</button>
    </div>`;
  }
  // playing
  if(ct.key==='matching') return renderMatching(sx,md,t);
  if(ct.key==='drugForCondition'||ct.key==='conditionForDrug'||ct.key==='mcq') return renderSingle(sx,md,t,ct);
  if(ct.key==='typing') return renderTyping(sx,md,t);
}

function renderMatching(sx,md,t){
  const q=state.quiz;
  const qd=md.quizData.matching||[];
  if(!q.mDrugs){ q.mDrugs=shuffle(qd); q.mConds=shuffle(qd); }
  let h=`<div class="fade"><div class="match-head"><p>Tap a drug then its matching condition</p><span class="quiz-score" style="background:${t.light};color:${t.dark};border-color:${t.border}">${q.matched.length}/${qd.length}</span></div>`;
  h+=`<div class="match-grid">`;
  // drugs col
  h+=`<div class="match-col"><p class="match-coltitle">Drugs</p>`;
  q.mDrugs.forEach((item,i)=>{
    const matched=q.matched.includes(item.condition);
    const sel=q.matchSel&&q.matchSel.type==='drug'&&q.matchSel.item===item.condition;
    const style=sel?`style="background:${gradR(sx.tk)}"`:'';
    h+=`<button class="match-item ${matched?'matched':sel?'sel-drug':''}" ${style} ${matched?'disabled':''} onclick="matchTap('drug',${i})">${matched?'✓ ':''}${escHtml(item.drug)}</button>`;
  });
  h+=`</div>`;
  // conds col
  h+=`<div class="match-col"><p class="match-coltitle">Conditions</p>`;
  q.mConds.forEach((item,i)=>{
    const matched=q.matched.includes(item.condition);
    const sel=q.matchSel&&q.matchSel.type==='cond'&&q.matchSel.item===item.condition;
    h+=`<button class="match-item ${matched?'matched':sel?'sel-cond':''}" ${matched?'disabled':''} onclick="matchTap('cond',${i})">${matched?'✓ ':''}${escHtml(item.condition)}</button>`;
  });
  h+=`</div></div>`;
  if(q.matched.length===qd.length) h+=`<button class="btn-full" style="background:${gradR(sx.tk)};padding:16px;border-radius:16px" onclick="quizComplete()">✓ All matched — Continue</button>`;
  h+=`</div>`;
  return h;
}

function renderSingle(sx,md,t,ct){
  const q=state.quiz;
  const qd=md.quizData[ct.key]||[];
  const item=qd[q.qi];
  if(!item) return '';
  if(!q.shuffledOpts){
    if(ct.key==='mcq') q.shuffledOpts=item.options;
    else if(ct.key==='drugForCondition') q.shuffledOpts=shuffle([item.correct,...item.distractors]);
    else q.shuffledOpts=shuffle(item.conditions);
  }
  const prompt=ct.key==='mcq'?item.q:ct.key==='drugForCondition'?item.condition:`Drug: ${item.drug}`;
  const qlabel=ct.key==='mcq'?'Question':ct.key==='drugForCondition'?'Condition shown':'Drug given';
  let h=`<div class="fade"><div class="quiz-head"><span class="quiz-qnum">Q${q.qi+1}/${qd.length}</span><span class="quiz-score" style="background:${t.light};color:${t.dark};border-color:${t.border}">${q.qScore.correct}/${q.qScore.total}</span></div>`;
  h+=`<div class="quiz-prompt" style="background:${grad(sx.tk)}"><p class="qlabel">${qlabel}</p><p class="qtext">${escHtml(prompt)}</p></div>`;
  h+=`<div class="options ${ct.key==='mcq'?'mcq':''}">`;
  q.shuffledOpts.forEach((opt,i)=>{
    let cls='opt';
    let ic='';
    if(q.answered){
      const isOk=opt===item.correct, isSel=q.selAns===opt;
      if(isOk){cls+=' correct';ic=`<span class="ic" style="color:#10b981">${IC.checkSm}</span>`;}
      else if(isSel){cls+=' wrong';ic=`<span class="ic" style="color:#fb7185">${IC.xc}</span>`;}
      else cls+=' dim';
    }
    h+=`<button class="${cls}" ${q.answered?'disabled':''} onclick="answerSingle(${i})"><span>${escHtml(opt)}</span>${ic}</button>`;
  });
  h+=`</div>`;
  if(q.answered) h+=`<button class="btn-full" style="background:${gradR(sx.tk)}" onclick="advanceQuiz()">${q.qi+1<qd.length?'Next Question':'See Results'} ${IC.chevR}</button>`;
  h+=`</div>`;
  return h;
}

function renderTyping(sx,md,t){
  const q=state.quiz;
  const qd=md.quizData.typing||[];
  const item=qd[q.qi];
  if(!item) return '';
  let h=`<div class="fade"><div class="quiz-head"><span class="quiz-qnum">Q${q.qi+1}/${qd.length}</span><span class="quiz-score" style="background:${t.light};color:${t.dark};border-color:${t.border}">${q.qScore.correct}/${q.qScore.total}</span></div>`;
  h+=`<div class="quiz-prompt" style="background:${grad(sx.tk)}"><p class="qlabel">Clinical Scenario</p><p class="qtext" style="font-weight:500;line-height:1.5">${escHtml(item.scenario)}</p></div>`;
  h+=`<input class="type-input" id="typeInput" placeholder="Type your answer..." value="${escHtml(q.typeInput)}" ${q.typeRes!==null?'disabled':''} oninput="state.quiz.typeInput=this.value" onkeydown="if(event.key==='Enter'&&this.value.trim()&&state.quiz.typeRes===null)checkTyping()">`;
  if(q.typeRes===null) h+=`<button class="btn-full" style="background:${gradR(sx.tk)}" onclick="checkTyping()">Submit</button>`;
  if(q.typeRes==='correct') h+=`<div class="type-result correct"><p>${IC.checkSm} Correct!</p></div>`;
  if(q.typeRes==='wrong') h+=`<div class="type-result wrong"><p class="t">${IC.xc} Incorrect</p><p class="a">Answer: <strong>${escHtml(item.answer)}</strong></p></div>`;
  if(q.typeRes!==null) h+=`<button class="btn-full" style="background:${gradR(sx.tk)};margin-top:8px" onclick="advanceQuiz()">${q.qi+1<qd.length?'Next':'Results'} ${IC.chevR}</button>`;
  h+=`</div>`;
  return h;
}

function renderDone(sx){
  return `<div class="done fade">
    <div class="trophy">🏆</div>
    <h2>Module Complete!</h2>
    <div class="done-pill" style="background:${gradR(sx.tk)}">${escHtml(sx.affix)} — ${escHtml(sx.action)}</div>
    <div class="done-actions">
      <button class="btn-outline" onclick="repeatModule()">${IC.rotate} Repeat</button>
      <button class="btn-rose" onclick="goHome()">${IC.arrowLeft} More Classes</button>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   PART 5 — EVENT HANDLERS & INIT
   Navigation, quiz interaction handlers, and app start-up
   ══════════════════════════════════════════════════════════════════════════ */

function createChallenge({mode,key,title,kicker,items,returnView}){
  const prepared=prepareChallengeItems(items).slice(0,20);
  state.challenge={
    mode,key,title,kicker,returnView,items:prepared,index:0,phase:"playing",itemAnswered:false,
    selected:null,input:"",correct:0,answeredCount:0,responses:[],
    breakdown:{primary:{correct:0,total:0},emergency:{correct:0,total:0},ed:{correct:0,total:0}}
  };
  state.view="challenge";
  state.menuOpen=false;
  render(); window.scrollTo(0,0);
}
function startMedicationChallenge(id){
  const sx=SYSTEM.suffixes.find(s=>s.id===id);
  if(!sx) return;
  createChallenge({mode:"medication",key:id,title:`${sx.action}: Clinical 20`,kicker:"Medication class challenge",items:shuffle(buildMedicationQuestions(id)),returnView:"module"});
}
function startConditionChallenge(id){
  const topic=CONDITION_TOPICS.find(t=>t.id===id);
  if(!topic) return;
  createChallenge({mode:"condition",key:id,title:topic.label,kicker:"Cardiac condition challenge",items:buildConditionQuestions(id),returnView:"conditions"});
}
function startEssentialChallenge(){
  const back=state.view==="conditions"?"conditions":"home";
  createChallenge({mode:"essential",key:"essential",title:"Essential & Emergency Medicines",kicker:"Broader cardiac medicines",items:shuffle(ESSENTIAL_CARDIAC_QUESTIONS),returnView:back});
}
function startRandomChallenge(){
  const back=state.view==="conditions"?"conditions":"home";
  createChallenge({mode:"random",key:"random",title:"Random Cardiac 20",kicker:"All medicines · all care settings",items:buildRandomQuestions(),returnView:back});
}
function normalizeClinicalAnswer(value){
  return String(value||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g," ").trim();
}
function recordChallengeResponse(correct,given){
  const c=state.challenge;
  if(!c||c.itemAnswered) return;
  const item=c.items[c.index];
  c.itemAnswered=true;
  c.selected=given;
  c.answeredCount++;
  if(correct) c.correct++;
  c.breakdown[item.focus].total++;
  if(correct) c.breakdown[item.focus].correct++;
  c.responses.push({item,correct,given});
  setStreak(correct);
  saveProgress();
  render();
}
function answerChallenge(index){
  const c=state.challenge;
  if(!c||c.itemAnswered) return;
  const item=c.items[c.index];
  const selected=item.options[index];
  recordChallengeResponse(selected===item.answer,selected);
}
function submitChallengeTyping(){
  const c=state.challenge;
  if(!c||c.itemAnswered||!c.input.trim()) return;
  const item=c.items[c.index];
  const entered=normalizeClinicalAnswer(c.input);
  const answers=(item.accepted||[item.answer]).map(normalizeClinicalAnswer);
  const correct=answers.some(answer=>entered===answer||(answer.length>=4&&entered.includes(answer)));
  recordChallengeResponse(correct,c.input.trim());
}
function nextChallengeQuestion(){
  const c=state.challenge;
  if(!c||!c.itemAnswered) return;
  if(c.index+1<c.items.length){
    c.index++; c.itemAnswered=false; c.selected=null; c.input="";
    render(); window.scrollTo(0,0); return;
  }
  c.phase="done";
  state.totalScore.correct+=c.correct;
  state.totalScore.total+=c.answeredCount;
  const score=Math.round((c.correct/Math.max(c.answeredCount,1))*100);
  const scoreKey=`${c.mode}:${c.key}`;
  state.challengeBest[scoreKey]=Math.max(Number(state.challengeBest[scoreKey])||0,score);
  saveProgress();
  render(); window.scrollTo(0,0);
}
function repeatChallenge(){
  const c=state.challenge;
  if(!c) return;
  const config={mode:c.mode,key:c.key,title:c.title,kicker:c.kicker,returnView:c.returnView,items:[]};
  if(c.mode==="medication") config.items=shuffle(buildMedicationQuestions(c.key));
  else if(c.mode==="condition") config.items=buildConditionQuestions(c.key);
  else if(c.mode==="essential") config.items=shuffle(ESSENTIAL_CARDIAC_QUESTIONS);
  else config.items=buildRandomQuestions();
  createChallenge(config);
}
function exitChallenge(){
  const back=state.challenge?.returnView||"home";
  state.challenge=null;
  state.view=back;
  if(back==="module") state.phase="slides";
  render(); window.scrollTo(0,0);
}
function showConditions(){ state.view="conditions"; state.menuOpen=false; render(); window.scrollTo(0,0); }
function startRandomFromMenu(){ state.menuOpen=false; state.view="home"; startRandomChallenge(); }
function startEssentialFromMenu(){ state.menuOpen=false; state.view="home"; startEssentialChallenge(); }

function toggleMenu(){ state.menuOpen=!state.menuOpen; render(); }
function closeMenu(){ state.menuOpen=false; render(); }
function openSettings(){ state.settingsOpen=true; render(); }
function closeSettings(){ state.settingsOpen=false; render(); }
function navTo(v){ state.view=v; state.menuOpen=false; state.challenge=null; render(); window.scrollTo(0,0); }
function navModule(id){ state.menuOpen=false; startSuffix(id); }
function startSuffix(id){ state.activeSuffix=SYSTEM.suffixes.find(s=>s.id===id); state.phase='slides'; state.slideIdx=0; state.biblioOpen=false; state.view='module'; render(); window.scrollTo(0,0); }
function goHome(){ state.view='home'; state.phase='slides'; state.challenge=null; render(); window.scrollTo(0,0); }
function prevSlide(){ if(state.slideIdx>0){state.slideIdx--;state.biblioOpen=false;render();window.scrollTo(0,0);} }
function nextSlide(){ const md=ALL_MODULES[state.activeSuffix.id]; const secs=enabledSlideSections(md); if(state.slideIdx<secs.length-1){state.slideIdx++;state.biblioOpen=false;render();window.scrollTo(0,0);} }
function toggleBiblio(){ state.biblioOpen=!state.biblioOpen; render(); }
function backToSlides(){ state.phase='slides'; render(); window.scrollTo(0,0); }
function repeatModule(){ state.phase='slides'; state.slideIdx=0; render(); window.scrollTo(0,0); }

function toggleSection(k){ state.enabledSections[k]=state.enabledSections[k]===false?undefined:false; saveProgress(); render(); }
function toggleQuiz(k){ state.enabledQuizTypes[k]=state.enabledQuizTypes[k]===false?undefined:false; saveProgress(); render(); }

function setStreak(ok){ state.streak=ok?state.streak+1:0; }
function recordAnswer(ok){
  const q=state.quiz;
  q.score.correct+=ok?1:0; q.score.total++;
  q.qScore.correct+=ok?1:0; q.qScore.total++;
  setStreak(ok);
  saveProgress();
}

function beginQuiz(){ state.quiz.phase='playing'; state.quiz.qi=0; state.quiz.answered=false; state.quiz.selAns=null; state.quiz.qScore={correct:0,total:0}; state.quiz.shuffledOpts=null; state.quiz.matchSel=null; state.quiz.matched=[]; state.quiz.mDrugs=null; state.quiz.mConds=null; state.quiz.typeRes=null; state.quiz.typeInput=''; render(); window.scrollTo(0,0); }

function answerSingle(i){
  const q=state.quiz; if(q.answered) return;
  const opt=q.shuffledOpts[i];
  const md=ALL_MODULES[state.activeSuffix.id];
  const ct=q.types[q.ti];
  const item=md.quizData[ct.key][q.qi];
  q.selAns=opt; q.answered=true;
  recordAnswer(opt===item.correct);
  render();
}

function advanceQuiz(){
  const q=state.quiz;
  const md=ALL_MODULES[state.activeSuffix.id];
  const ct=q.types[q.ti];
  const qd=md.quizData[ct.key]||[];
  if(q.qi+1<qd.length){ q.qi++; q.answered=false; q.selAns=null; q.shuffledOpts=null; q.typeRes=null; q.typeInput=''; render(); window.scrollTo(0,0); }
  else quizComplete();
}

function quizComplete(){ state.quiz.phase='complete'; render(); window.scrollTo(0,0); }

function nextQuizType(){
  const q=state.quiz;
  if(q.ti+1<q.types.length){
    q.ti++; q.phase='intro'; q.qi=0; q.answered=false; q.selAns=null; q.qScore={correct:0,total:0}; q.shuffledOpts=null; q.matchSel=null; q.matched=[]; q.mDrugs=null; q.mConds=null; q.typeRes=null; q.typeInput='';
    render(); window.scrollTo(0,0);
  } else finishModule();
}

function finishModule(){
  state.completed[state.activeSuffix.id]=true;
  state.totalScore.correct+=state.quiz.score.correct;
  state.totalScore.total+=state.quiz.score.total;
  state.phase='done';
  saveProgress();
  render(); window.scrollTo(0,0);
}

function matchTap(type,i){
  const q=state.quiz;
  const item=type==='drug'?q.mDrugs[i]:q.mConds[i];
  if(q.matched.includes(item.condition)) return;
  const otherType=type==='drug'?'cond':'drug';
  if(q.matchSel&&q.matchSel.type===type&&q.matchSel.item===item.condition){ q.matchSel=null; render(); return; }
  if(q.matchSel&&q.matchSel.type===otherType){
    const ok=q.matchSel.item===item.condition;
    if(ok) q.matched.push(item.condition);
    q.matchSel=null;
    recordAnswer(ok);
  } else {
    q.matchSel={type,item:item.condition};
  }
  render();
}

function checkTyping(){
  const q=state.quiz;
  const md=ALL_MODULES[state.activeSuffix.id];
  const item=md.quizData.typing[q.qi];
  const ok=q.typeInput.toLowerCase().trim().includes(item.answer.toLowerCase());
  q.typeRes=ok?'correct':'wrong';
  recordAnswer(ok);
  render();
}

// init
render();

</script>
</body>
</html>
